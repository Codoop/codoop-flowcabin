<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Star Catcher cover</title>
  <desc id="desc">A glowing catcher beneath cyan stars and red debris.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#08152f"/>
      <stop offset="1" stop-color="#321742"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="890" cy="160" r="52" fill="#77e7ff" opacity=".65" filter="url(#glow)"/>
  <circle cx="890" cy="160" r="25" fill="#c7f7ff"/>
  <circle cx="1020" cy="260" r="34" fill="#ff526f" opacity=".65" filter="url(#glow)"/>
  <circle cx="1020" cy="260" r="17" fill="#ff7088"/>
  <rect x="760" y="515" width="270" height="30" rx="15" fill="#f6f1a2"/>
  <text x="90" y="300" fill="#edf6ff" font-family="system-ui, sans-serif" font-size="104" font-weight="800">STAR</text>
  <text x="90" y="405" fill="#77e7ff" font-family="system-ui, sans-serif" font-size="104" font-weight="800">CATCHER</text>
  <text x="96" y="475" fill="#9fb5dc" font-family="system-ui, sans-serif" font-size="28" letter-spacing="7">FLOW CABIN ARCADE</text>
</svg>
